<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strata · 知识库全景</title>
<style>
:root{
  --bg:#f5f7fa; --panel:#ffffff; --line:#e4e9f0; --line2:#eef2f7;
  --text:#16212e; --muted:#62748a; --dim:#9aa9ba; --acc:#2563eb;
  --shadow:0 1px 2px rgba(16,32,56,.06),0 4px 14px rgba(16,32,56,.06);
  --shadow-hi:0 2px 8px rgba(16,32,56,.10),0 12px 28px rgba(16,32,56,.12);
}
[data-theme=dark]{
  --bg:#0e151d; --panel:#151f2b; --line:#22303f; --line2:#1b2634;
  --text:#e3ebf4; --muted:#8fa3b8; --dim:#5d7186; --acc:#60a5fa;
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-hi:0 2px 10px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--text); overflow:hidden;
  font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
  -webkit-font-smoothing:antialiased;
}
code,.mono{font-family:"SF Mono",Consolas,"Cascadia Code",ui-monospace,monospace}

/* ---------------- 顶栏 ---------------- */
#bar{
  position:fixed; inset:0 0 auto 0; height:52px; z-index:40;
  display:flex; align-items:center; gap:14px; padding:0 16px;
  background:color-mix(in srgb,var(--panel) 92%,transparent);
  backdrop-filter:blur(12px); border-bottom:1px solid var(--line);
}
#brand{display:flex; align-items:baseline; gap:8px; white-space:nowrap}
#brand b{font-size:15px; font-weight:700; letter-spacing:.2px}
#brand span{font-size:11px; color:var(--dim)}
#stat{font-size:11.5px; color:var(--muted); white-space:nowrap; font-variant-numeric:tabular-nums}
#stat i{font-style:normal; color:var(--text); font-weight:600}
#stat em{font-style:normal; color:#d97706; font-weight:600}

#q{
  flex:1; min-width:120px; max-width:340px; height:32px; padding:0 12px 0 30px;
  border:1px solid var(--line); border-radius:8px; background:var(--bg);
  color:var(--text); font-size:12.5px; outline:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%239aa9ba' stroke-width='2.4'><circle cx='11' cy='11' r='7'/><path d='M20 20l-4-4'/></svg>");
  background-repeat:no-repeat; background-position:10px center;
}
#q:focus{border-color:var(--acc); box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 14%,transparent)}

.chips{display:flex; gap:6px; align-items:center}
.chip{
  height:26px; padding:0 9px; border-radius:7px; border:1px solid var(--line);
  background:var(--panel); color:var(--muted); font-size:11.5px; cursor:pointer;
  display:inline-flex; align-items:center; gap:5px; user-select:none; white-space:nowrap;
  transition:.12s;
}
.chip:hover{border-color:var(--dim)}
.chip .dot{width:7px; height:7px; border-radius:50%; flex:none}
.chip.on{color:var(--text); border-color:currentColor; font-weight:600}
.chip[data-s=intent].on{color:#4f46e5; background:#eef2ff}
.chip[data-s=mechanism].on{color:#0e7490; background:#ecfeff}
.chip[data-s=verification].on{color:#b45309; background:#fffbeb}
.chip[data-s=implementation].on{color:#475569; background:#f1f5f9}
.chip[data-s=concept].on{color:#047857; background:#ecfdf5}
[data-theme=dark] .chip[data-s=intent].on{background:#1e1b4b; color:#a5b4fc}
[data-theme=dark] .chip[data-s=mechanism].on{background:#083344; color:#67e8f9}
[data-theme=dark] .chip[data-s=verification].on{background:#422006; color:#fcd34d}
[data-theme=dark] .chip[data-s=implementation].on{background:#1e293b; color:#cbd5e1}
[data-theme=dark] .chip[data-s=concept].on{background:#022c22; color:#6ee7b7}

.btn{
  height:26px; padding:0 10px; border-radius:7px; border:1px solid var(--line);
  background:var(--panel); color:var(--muted); font-size:11.5px; cursor:pointer;
  white-space:nowrap; transition:.12s;
}
.btn:hover{color:var(--text); border-color:var(--dim)}
.btn:active{transform:translateY(1px)}
.btn.on{background:var(--acc); border-color:var(--acc); color:#fff}

/* ---------------- 画布 ---------------- */
#stage{position:fixed; inset:52px 0 0 0; overflow:hidden; cursor:grab}
#stage.drag{cursor:grabbing}
#world{position:absolute; transform-origin:0 0; will-change:transform}
#edges{position:absolute; left:0; top:0; overflow:visible; pointer-events:none}
#edges path{fill:none; stroke-linecap:round; opacity:.5; transition:opacity .12s}
#edges path.dim{opacity:.045}

.e.composed_of{stroke:#6366f1} .e.verified_by{stroke:#06b6d4}
.e.exercises{stroke:#f59e0b} .e.depends_on{stroke:#94a3b8} .e.fulfills{stroke:#a855f7}
.e.explains{stroke:#10b981} .e.related_to{stroke:#fb7185}
[data-theme=dark] .e.composed_of{stroke:#818cf8} [data-theme=dark] .e.verified_by{stroke:#22d3ee}
[data-theme=dark] .e.exercises{stroke:#fbbf24} [data-theme=dark] .e.depends_on{stroke:#64748b}
[data-theme=dark] .e.fulfills{stroke:#c084fc}
[data-theme=dark] .e.explains{stroke:#34d399} [data-theme=dark] .e.related_to{stroke:#fda4af}

.colhead{
  position:absolute; display:flex; align-items:baseline; gap:9px; pointer-events:none;
  padding-bottom:9px; border-bottom:1px solid var(--line);
}
.colhead b{font-size:13px; font-weight:700; letter-spacing:.3px}
.colhead span{font-size:11px; color:var(--dim); font-variant-numeric:tabular-nums}
.colhead::before{
  content:""; position:absolute; left:0; bottom:-1px; width:38px; height:2px;
  background:var(--cc); border-radius:2px;
}

/* 节点 */
.n{
  position:absolute; height:24px; display:flex; align-items:center; gap:7px;
  padding:0 9px 0 8px; border-radius:6px; cursor:pointer;
  background:var(--panel); border:1px solid var(--line);
  box-shadow:0 1px 1px rgba(16,32,56,.04);
  transition:box-shadow .12s, border-color .12s, opacity .12s, transform .1s;
  overflow:hidden; white-space:nowrap;
}
.n::before{
  content:""; width:3px; height:14px; border-radius:2px; background:var(--cc); flex:none;
}
.n:hover{border-color:var(--cc); box-shadow:var(--shadow); z-index:5; transform:translateX(2px)}
.n .t{font-size:11.5px; overflow:hidden; text-overflow:ellipsis; flex:1; min-width:0}
.n .b{
  font-size:10px; color:var(--muted); font-variant-numeric:tabular-nums; flex:none;
  background:var(--line2); padding:0 4px; border-radius:4px; line-height:15px;
}
.n.intent{--cc:#4f46e5} .n.mechanism{--cc:#0891b2}
.n.verification{--cc:#d97706} .n.implementation{--cc:#64748b}
.n.concept{--cc:#059669}
[data-theme=dark] .n.intent{--cc:#818cf8} [data-theme=dark] .n.mechanism{--cc:#22d3ee}
[data-theme=dark] .n.verification{--cc:#fbbf24} [data-theme=dark] .n.implementation{--cc:#94a3b8}
[data-theme=dark] .n.concept{--cc:#34d399}

.n.draft,.n.proposed{border-style:dashed}
.n.orphan{border-style:dashed; background:transparent}
.n.orphan::before{opacity:.45}
.n.dim{opacity:.16}
.n.sel{
  border-color:var(--cc); box-shadow:0 0 0 2px color-mix(in srgb,var(--cc) 30%,transparent), var(--shadow-hi);
  z-index:6;
}
.n.hit{box-shadow:0 0 0 2px #fbbf24, var(--shadow); z-index:4}
.n.path{background:color-mix(in srgb,var(--cc) 7%,var(--panel))}

/* 折叠组 */
.g{
  position:absolute; height:30px; display:flex; align-items:center; gap:8px;
  padding:0 10px; border-radius:7px; cursor:pointer; user-select:none;
  background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--cc);
  box-shadow:var(--shadow); transition:.12s; overflow:hidden; white-space:nowrap;
}
.g:hover{border-color:var(--cc); border-left-color:var(--cc); transform:translateX(2px)}
.g .caret{
  width:0; height:0; flex:none; border-left:5px solid var(--muted);
  border-top:4px solid transparent; border-bottom:4px solid transparent;
  transition:transform .15s;
}
.g.open .caret{transform:rotate(90deg) translateX(1px)}
.g .t{font-size:11.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; flex:1; min-width:0}
.g .b{font-size:10.5px; color:var(--muted); background:var(--line2); padding:0 5px; border-radius:4px; line-height:16px; flex:none}
.g .w{font-size:10px; color:#d97706; flex:none; font-variant-numeric:tabular-nums}
.g.dim{opacity:.16}
.g.sel{border-color:var(--cc); box-shadow:0 0 0 2px color-mix(in srgb,var(--cc) 28%,transparent)}
.g.child{--cc:#94a3b8; border-left-width:2px; margin-left:14px; width:calc(100% - 14px)}
.g.child .t{font-weight:500; font-size:11px}
.g.concept{--cc:#059669} .g.intent{--cc:#4f46e5} .g.mechanism{--cc:#0891b2}
.g.verification{--cc:#d97706} .g.implementation{--cc:#64748b}
[data-theme=dark] .g.concept{--cc:#34d399}

/* ---------------- 详情抽屉 ---------------- */
#panel{
  position:fixed; top:52px; right:0; bottom:0; width:400px; z-index:50;
  background:var(--panel); border-left:1px solid var(--line);
  transform:translateX(102%); transition:transform .22s cubic-bezier(.4,0,.2,1);
  display:flex; flex-direction:column; box-shadow:-8px 0 32px rgba(16,32,56,.08);
}
#panel.on{transform:none}
#ph{padding:16px 18px 13px; border-bottom:1px solid var(--line); flex:none; position:relative}
#ph .tagrow{display:flex; align-items:center; gap:7px; margin-bottom:9px; flex-wrap:wrap}
.tag{
  font-size:10.5px; padding:1.5px 7px; border-radius:5px; font-weight:600; letter-spacing:.2px;
  background:var(--line2); color:var(--muted);
}
.tag.intent{background:#eef2ff; color:#4338ca} .tag.mechanism{background:#ecfeff; color:#0e7490}
.tag.verification{background:#fffbeb; color:#b45309} .tag.implementation{background:#f1f5f9; color:#475569}
.tag.concept{background:#ecfdf5; color:#047857}
[data-theme=dark] .tag.intent{background:#1e1b4b; color:#a5b4fc}
[data-theme=dark] .tag.mechanism{background:#083344; color:#67e8f9}
[data-theme=dark] .tag.verification{background:#422006; color:#fcd34d}
[data-theme=dark] .tag.implementation{background:#1e293b; color:#cbd5e1}
[data-theme=dark] .tag.concept{background:#022c22; color:#6ee7b7}
.tag.c-certain{background:#dcfce7; color:#15803d}
.tag.c-likely{background:#e0f2fe; color:#0369a1}
.tag.c-possible{background:#fef3c7; color:#b45309}
[data-theme=dark] .tag.c-certain{background:#052e16; color:#86efac}
[data-theme=dark] .tag.c-likely{background:#082f49; color:#7dd3fc}
[data-theme=dark] .tag.c-possible{background:#422006; color:#fcd34d}
.tag.st-draft{background:#fef2f2; color:#b91c1c; border:1px dashed #fca5a5}
.tag.st-proposed{background:#fef2f2; color:#b91c1c; border:1px dashed #fca5a5}
[data-theme=dark] .tag.st-draft,[data-theme=dark] .tag.st-proposed{background:#450a0a; color:#fca5a5}

#ph h2{margin:0; font-size:14.5px; line-height:1.42; font-weight:650; word-break:break-word; padding-right:26px}
#pclose{
  position:absolute; top:14px; right:14px; width:22px; height:22px; border:0; border-radius:6px;
  background:transparent; color:var(--dim); cursor:pointer; font-size:16px; line-height:1;
}
#pclose:hover{background:var(--line2); color:var(--text)}
#pbody{flex:1; overflow-y:auto; padding:0 18px 24px}
#pbody::-webkit-scrollbar{width:9px}
#pbody::-webkit-scrollbar-thumb{background:var(--line); border-radius:5px; border:2px solid var(--panel)}

.sect{margin-top:16px}
.sect h3{
  font-size:10.5px; font-weight:700; color:var(--dim); letter-spacing:.9px;
  text-transform:uppercase; margin:0 0 8px; display:flex; align-items:center; gap:7px;
}
.sect h3::after{content:""; flex:1; height:1px; background:var(--line2)}
.kv{display:grid; grid-template-columns:78px 1fr; gap:5px 10px; font-size:11.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0; word-break:break-all; font-family:"SF Mono",Consolas,monospace; font-size:11px}
.rel{display:flex; flex-direction:column; gap:3px}
.rel a{
  display:flex; align-items:center; gap:7px; padding:5px 8px; border-radius:6px;
  text-decoration:none; color:var(--text); font-size:11.5px; cursor:pointer;
  border:1px solid transparent; transition:.1s;
}
.rel a:hover{background:var(--line2); border-color:var(--line)}
.rel a .k{
  font-size:9.5px; color:var(--muted); background:var(--line2); padding:0 5px;
  border-radius:4px; flex:none; font-family:"SF Mono",Consolas,monospace;
}
.rel a .x{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1}
.rel a .n{font-size:10px; color:var(--dim); flex:none}
.rel .empty{font-size:11.5px; color:var(--dim); padding:4px 8px; font-style:italic}
pre.body{
  margin:0; padding:11px 12px; background:var(--bg); border:1px solid var(--line);
  border-radius:7px; font-size:11px; line-height:1.62; white-space:pre-wrap; word-break:break-word;
  font-family:"SF Mono",Consolas,ui-monospace,monospace; color:var(--muted); max-height:300px; overflow:auto;
}
#pacts{display:flex; gap:6px; margin-top:10px; flex-wrap:wrap}

/* ---------------- 左下角图例 / 右下角缩放 ---------------- */
#legend{
  position:fixed; left:14px; bottom:14px; z-index:30;
  background:color-mix(in srgb,var(--panel) 94%,transparent); backdrop-filter:blur(8px);
  border:1px solid var(--line); border-radius:9px; padding:9px 11px;
  display:flex; flex-direction:column; gap:6px; box-shadow:var(--shadow); font-size:11px;
}
#legend .row{display:flex; align-items:center; gap:7px; color:var(--muted)}
#legend .sw{width:18px; height:2.5px; border-radius:2px; flex:none}
#legend .sw.dash{background:none!important; border-top:2px dashed currentColor; height:0}
#legend hr{border:0; border-top:1px solid var(--line2); margin:1px 0}
#zoom{
  position:fixed; right:414px; bottom:14px; z-index:30; display:flex; gap:4px;
  transition:right .22s cubic-bezier(.4,0,.2,1);
}
body.panel-open #zoom{right:14px}
#zoom button{
  width:28px; height:28px; border-radius:7px; border:1px solid var(--line); background:var(--panel);
  color:var(--muted); cursor:pointer; font-size:14px; line-height:1; box-shadow:var(--shadow);
}
#zoom button:hover{color:var(--text); border-color:var(--dim)}
#zoom .lvl{
  height:28px; min-width:44px; display:flex; align-items:center; justify-content:center;
  border-radius:7px; border:1px solid var(--line); background:var(--panel);
  font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums; box-shadow:var(--shadow);
}
#hint{
  position:fixed; left:50%; bottom:16px; transform:translateX(-50%); z-index:25;
  font-size:11px; color:var(--dim); pointer-events:none; white-space:nowrap;
}
#hint kbd{
  font-family:inherit; background:var(--panel); border:1px solid var(--line); border-bottom-width:2px;
  border-radius:4px; padding:0 4px; font-size:10.5px; color:var(--muted);
}
#empty{
  position:fixed; inset:52px 0 0 0; display:none; align-items:center; justify-content:center;
  color:var(--dim); font-size:13px; z-index:20;
}
/* 自绘悬浮提示：原生 title 的提示框浮在页面最上层，会挡住下面的节点
   （Windows 上还可能吞掉第一次点击），所以换成 pointer-events:none 的自绘框，
   保证永远不会挡住任何内容和点击。 */
#tip{
  position:fixed; z-index:45; max-width:340px; pointer-events:none;
  background:color-mix(in srgb,var(--panel) 96%,transparent); backdrop-filter:blur(8px);
  border:1px solid var(--line); border-radius:8px; padding:8px 10px;
  box-shadow:var(--shadow); font-size:11.5px; line-height:1.55; color:var(--muted);
  opacity:0; transition:opacity .12s;
}
#tip.on{opacity:1}
#tip b{
  display:block; color:var(--text); font-size:12px; margin-bottom:2px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:320px;
}
#tip .m{color:var(--dim)}
</style>
</head>
<body>

<header id="bar">
  <div id="brand"><b>Strata</b><span>知识库全景</span></div>
  <input id="q" placeholder="搜索节点…  支持 slot:mechanism / conf:certain / status:draft / file:xxx">
  <div class="chips" id="slotchips"></div>
  <button class="btn" id="execBtn" title="显示用例→代码的执行边（量大，默认只在选中节点时点亮）">执行边</button>
  <button class="btn" id="orphanBtn" title="只显示没有任何连线的节点">只看孤儿</button>
  <button class="btn" id="expandBtn" title="展开所有折叠组">全部展开</button>
  <button class="btn" id="fitBtn" title="适应窗口 (f)">适应</button>
  <button class="btn" id="themeBtn" title="切换深浅色">◐</button>
  <div id="stat"></div>
</header>

<div id="stage">
  <div id="world">
    <svg id="edges"></svg>
    <div id="nodes"></div>
  </div>
</div>

<aside id="panel">
  <div id="ph">
    <button id="pclose" title="关闭 (Esc)">×</button>
    <div class="tagrow" id="ptags"></div>
    <h2 id="ptitle"></h2>
  </div>
  <div id="pbody"></div>
</aside>

<div id="legend"></div>
<div id="zoom">
  <button id="zo" title="缩小">−</button>
  <div class="lvl" id="zlvl">100%</div>
  <button id="zi" title="放大">+</button>
</div>
<div id="hint">点击节点看详情 · <kbd>/</kbd> 搜索 · <kbd>f</kbd> 适应窗口 · <kbd>Esc</kbd> 取消</div>
<div id="empty">没有匹配的节点</div>

<script>
"use strict";
const DATA = __STRATA_DATA__;
const N = DATA.nodes, E = DATA.edges;

const SLOT_CN = {concept:"概念", intent:"场景", mechanism:"功能点", verification:"用例", implementation:"代码"};
const EDGE_CN = {
  composed_of:"由…组成", verified_by:"由…验证", exercises:"执行到",
  depends_on:"依赖", fulfills:"细化", explains:"解释", related_to:"相关"
};
/* conf / status 的中文名：界面展示一律用中文，原始英文值只留给搜索语法 */
const CONF_CN = {certain:"确定", likely:"很可能", possible:"可能"};
const ST_CN = {draft:"草稿", proposed:"待审", confirmed:"已确认", disputed:"存疑"};
/* 展示顺序：概念层在最左（explains 边指向右侧的场景/功能点），主链依次向右 */
const SLOT_ORDER = ["concept","intent","mechanism","verification","implementation"]
  .filter(s => N.some(n => n.slot === s));
const NC = SLOT_ORDER.length;

/* ---------------- 索引 ---------------- */
const outA = Array.from({length:N.length}, () => []);
const inA  = Array.from({length:N.length}, () => []);
E.forEach((e, i) => { outA[e.a].push(i); inA[e.b].push(i); });
const degOf = i => inA[i].length + outA[i].length;
N.forEach((n, i) => { n.i = i; n.deg = degOf(i); });
const orphanCount = N.filter(n => n.deg === 0).length;

/* ---------------- 排名（列内排序用） ---------------- */
const intentRank = new Map(
  N.filter(n => n.slot === "intent")
   .sort((a, b) => (b.deg - a.deg) || a.title.localeCompare(b.title))
   .map((n, k) => [n.i, k]));
const mechInDeg = new Map();
N.forEach((n, i) => { if (n.slot === "mechanism")
  mechInDeg.set(i, outA[i].filter(e => E[e].t === "verified_by").length); });
const mechRank = new Map(
  N.filter(n => n.slot === "mechanism")
   .sort((a, b) => (mechInDeg.get(b.i) - mechInDeg.get(a.i)) || a.title.localeCompare(b.title))
   .map((n, k) => [n.i, k]));

/* 父链：verification -> mechanism -> intent */
const parentMech = new Map(), parentIntent = new Map();
E.forEach(e => {
  if (e.t === "verified_by" && N[e.b].slot === "verification") parentMech.set(e.b, e.a);
  if (e.t === "composed_of" && N[e.b].slot === "mechanism") parentIntent.set(e.b, e.a);
});

/* ---------------- 分组树 ----------------
   大库的关键：列内不是平铺，是一棵可折叠的树。
   - 功能点超过 40 个 → 按所属场景分组
   - 用例按功能点分组；功能点组超过 40 个 → 再包一层按场景
   - 代码按文件分组；文件组超过 40 个 → 再包一层按目录
   默认全部折叠：2 万节点的库，默认视图也只有几十个胶囊。 */
const FLAT_CAP = 40, GROUP_CAP = 40;
const colTrees = new Map();     // slot -> [组树]
const leafPath = new Map();     // 节点 idx -> 它所有祖先组的 key（搜索/深链时逐层展开）
const allGroupKeys = [];

function mkGroup(key, label, slot, level) {
  allGroupKeys.push(key);
  return {key, label, slot, level, children: [], leaves: [], allLeaves: []};
}
function finalize(g) {
  g.allLeaves = g.leaves.slice();
  for (const ch of g.children) { finalize(ch); g.allLeaves.push(...ch.allLeaves); }
}

(function buildTrees() {
  /* 功能点：按场景分组 */
  const mechs = N.filter(n => n.slot === "mechanism");
  if (mechs.length > FLAT_CAP) {
    const byKey = new Map();
    for (const m of mechs) {
      const p = parentIntent.get(m.i);
      const key = p === undefined ? "m:_" : "m:" + p;
      let g = byKey.get(key);
      if (!g) g = mkGroup(key, p === undefined ? "未被场景认领" : N[p].title, "mechanism", 0), byKey.set(key, g);
      g.leaves.push(m.i); leafPath.set(m.i, [key]);
    }
    const entries = [...byKey.values()];
    const rank = g => g.key === "m:_" ? 9e9 : (intentRank.get(+g.key.slice(2)) ?? 9e8);
    entries.sort((a, b) => rank(a) - rank(b));
    entries.forEach(g => g.leaves.sort((a, b) =>
      (mechRank.get(a) ?? 9e9) - (mechRank.get(b) ?? 9e9) || N[a].title.localeCompare(N[b].title)));
    entries.forEach(finalize);
    colTrees.set("mechanism", entries);
  }

  /* 用例：按功能点分组；功能点太多再按场景包一层 */
  const tests = N.filter(n => n.slot === "verification");
  const byMech = new Map();
  for (const t of tests) {
    const p = parentMech.get(t.i);
    const key = p === undefined ? "v:_" : "v:" + p;
    let g = byMech.get(key);
    if (!g) g = mkGroup(key, p === undefined ? "未被功能点认领" : N[p].title, "verification", 1), byMech.set(key, g);
    g.leaves.push(t.i); leafPath.set(t.i, [key]);
  }
  byMech.forEach(g => g.leaves.sort((a, b) => N[a].title.localeCompare(N[b].title)));
  let vEntries = [...byMech.values()];
  const vRank = g => g.key === "v:_" ? 9e9 : (mechRank.get(+g.key.slice(2)) ?? 9e8);
  vEntries.sort((a, b) => vRank(a) - vRank(b));
  if (vEntries.length > GROUP_CAP) {
    const byIntent = new Map();
    for (const g of vEntries) {
      let ik = "vi:_", label = "未被场景认领";
      if (g.key !== "v:_") {
        const pi = parentIntent.get(+g.key.slice(2));
        if (pi !== undefined) { ik = "vi:" + pi; label = N[pi].title; }
      }
      let ig = byIntent.get(ik);
      if (!ig) ig = mkGroup(ik, label, "verification", 0), byIntent.set(ik, ig);
      ig.children.push(g);
      g.leaves.forEach(i => leafPath.set(i, [ik, g.key]));
    }
    const dents = [...byIntent.values()];
    const dRank = g => g.key === "vi:_" ? 9e9 : (intentRank.get(+g.key.slice(3)) ?? 9e8);
    dents.sort((a, b) => dRank(a) - dRank(b));
    dents.forEach(finalize);
    colTrees.set("verification", dents);
  } else {
    vEntries.forEach(finalize);
    colTrees.set("verification", vEntries);
  }

  /* 代码：按文件分组；文件太多再按目录包一层 */
  const syms = N.filter(n => n.slot === "implementation");
  const byFile = new Map();
  for (const s of syms) {
    const f = s.file || "（无文件）";
    const key = "f:" + f;
    let g = byFile.get(key);
    if (!g) g = mkGroup(key, f, "implementation", 1), byFile.set(key, g);
    g.leaves.push(s.i); leafPath.set(s.i, [key]);
  }
  byFile.forEach(g => g.leaves.sort((a, b) =>
    (N[a].line - N[b].line) || N[a].title.localeCompare(N[b].title)));
  let fEntries = [...byFile.values()];
  fEntries.sort((a, b) => a.label.localeCompare(b.label) || a.key.localeCompare(b.key));
  if (fEntries.length > GROUP_CAP) {
    const byDir = new Map();
    for (const g of fEntries) {
      const di = g.label.lastIndexOf("/");
      const dir = di < 0 ? "（根目录）" : g.label.slice(0, di);
      const key = "d:" + dir;
      let dg = byDir.get(key);
      if (!dg) dg = mkGroup(key, dir, "implementation", 0), byDir.set(key, dg);
      dg.children.push(g);
      g.leaves.forEach(i => leafPath.set(i, [key, g.key]));
    }
    const dents = [...byDir.values()].sort((a, b) => a.label.localeCompare(b.label));
    dents.forEach(finalize);
    colTrees.set("implementation", dents);
  } else {
    fEntries.forEach(finalize);
    colTrees.set("implementation", fEntries);
  }
})();

/* ---------------- 状态 ---------------- */
const S = {
  expanded: new Set(),
  sel: null,
  q: "",
  slots: new Set(SLOT_ORDER),
  orphansOnly: false,
  showExec: false,
  status: "all",
  scale: 1, tx: 0, ty: 0,
  items: [], colItems: [], colShown: [],
  nodeItem: new Map(), byUid: new Map(),
  agg: [], active: SLOT_ORDER.slice(),
  W: 0, H: 0,
};

/* ---------------- 布局常量 ---------------- */
const COL_W = 288, COL_GAP = 96, PAD = 40, TOP = 54;
const ROW_H = 24, ROW_STEP = 29, GRP_H = 30, GRP_STEP = 35;
const colX = c => PAD + c * (COL_W + COL_GAP);

function matchQ(n) {
  if (S.status === "confirmed" && n.status !== "confirmed") return false;
  if (S.status === "pending" && n.status === "confirmed") return false;
  if (S.orphansOnly && n.deg !== 0) return false;
  if (!S.q) return true;
  let q = S.q.toLowerCase();
  const hay = (n.title + " " + n.id).toLowerCase();
  /* 文件名只走 file: 前缀。混进普通关键字会把整个文件的符号都拽进来 */
  const m = q.match(/(\w+):(\S+)/g);
  if (m) {
    for (const tok of m) {
      const [k, v] = tok.split(":");
      q = q.replace(tok, "").trim();
      if (k === "slot" && !n.slot.startsWith(v)) return false;
      if (k === "conf" && !n.conf.startsWith(v)) return false;
      if (k === "status" && !n.status.startsWith(v)) return false;
      if (k === "file" && !n.file.toLowerCase().includes(v)) return false;
    }
  }
  return !q || hay.includes(q);
}

/* ---------------- 布局（只算坐标，不碰 DOM） ---------------- */
let L_visible, L_forceOpen, L_put;

function emitTree(entries) {
  let shown = 0;
  for (const g of entries) {
    const mem = g.allLeaves.filter(i => L_visible.has(i));
    if (!mem.length) continue;
    shown += mem.length;
    const open = S.expanded.has(g.key) || L_forceOpen.has(g.key);
    const git = {
      type:"group", uid:"g" + g.key, key:g.key, slot:g.slot, label:g.label,
      open, count:mem.length, members:mem, child:g.level > 0,
      orphanN: mem.reduce((a, i) => a + (N[i].deg === 0 ? 1 : 0), 0),
    };
    L_put(git);
    if (open) {
      emitTree(g.children);
      for (const i of g.leaves) {
        if (!L_visible.has(i)) continue;
        const it = {type:"node", uid:"n" + i, node:N[i], child:true};
        S.nodeItem.set(i, it); L_put(it);
      }
    } else {
      mem.forEach(i => S.nodeItem.set(i, git));
    }
  }
  return shown;
}

function layout() {
  S.items = []; S.nodeItem = new Map();
  L_visible = new Set();
  for (let i = 0; i < N.length; i++) if (matchQ(N[i])) L_visible.add(i);
  /* 搜索命中时把所在组链全部展开，否则搜到了也看不见 */
  L_forceOpen = new Set();
  if (S.q) L_visible.forEach(i => (leafPath.get(i) || []).forEach(k => L_forceOpen.add(k)));

  const active = SLOT_ORDER.filter(s => S.slots.has(s));
  S.active = active;
  const nCol = active.length;
  const colH = new Array(nCol).fill(0);
  const colShown = new Array(nCol).fill(0);
  const colItems = new Array(nCol).fill(null);

  for (let c = 0; c < nCol; c++) {
    const slot = active[c];
    let y = TOP;
    const arr = [];
    const put = it => {
      it.col = c; it.x = colX(c); it.y = y;
      it.h = it.type === "group" ? GRP_H : ROW_H;
      arr.push(it); y += it.type === "group" ? GRP_STEP : ROW_STEP;
    };
    L_put = put;

    if (colTrees.has(slot)) {
      colShown[c] = emitTree(colTrees.get(slot));
    } else {
      const list = N.filter(n => n.slot === slot && L_visible.has(n.i));
      if (slot === "mechanism")
        list.sort((a, b) => (mechRank.get(a.i) ?? 9e9) - (mechRank.get(b.i) ?? 9e9));
      else
        list.sort((a, b) => (b.deg - a.deg) || a.title.localeCompare(b.title));
      colShown[c] = list.length;
      list.forEach(n => {
        const it = {type:"node", uid:"n" + n.i, node:n};
        S.nodeItem.set(n.i, it); put(it);
      });
    }
    colH[c] = y - TOP;
    colItems[c] = arr;
    for (const it of arr) S.items.push(it);
  }

  /* 各列垂直居中 */
  const maxH = Math.max(0, ...colH);
  for (const it of S.items) it.y += (maxH - colH[it.col]) / 2;

  S.colItems = colItems; S.colShown = colShown;
  S.byUid = new Map(S.items.map(it => [it.uid, it]));
  S.W = colX(Math.max(0, nCol - 1)) + COL_W + PAD;
  S.H = TOP + maxH + 40;
}

/* ---------------- 渲染（视口虚拟化） ----------------
   2 万节点不可能全建 DOM：只给落在视口里的条目建元素，
   平移缩放时按帧增删。元素总数始终被视口大小限住。 */
const $ = id => document.getElementById(id);
const world = $("world"), svg = $("edges"), nodesEl = $("nodes"), stageEl = $("stage");
const rendered = new Map();   // uid -> el

function makeEl(it) {
  const el = document.createElement("div");
  if (it.type === "node") {
    const n = it.node;
    el.className = "n " + n.slot + (n.deg === 0 ? " orphan" : "") +
      (n.status !== "confirmed" ? " " + n.status : "");
    const indent = it.child ? 14 : 0;
    el.style.left = (it.x + indent) + "px";
    el.style.top = it.y + "px";
    el.style.width = (COL_W - indent) + "px";
    el.dataset.i = n.i;
    /* 悬浮提示改由自绘 #tip 处理（见下文），不再用原生 title：
       原生提示框浮在页面最上层，会挡住下面的节点。 */
    el.innerHTML = `<span class="t">${esc(n.title)}</span>` +
      (it.child ? "" : `<span class="b">${n.deg}</span>`);
  } else {
    el.className = "g" + (it.open ? " open" : "") + (it.child ? " child" : "");
    if (it.child) {
      el.style.left = (it.x + 14) + "px";
      el.style.top = it.y + "px";
      el.style.width = (COL_W - 14) + "px";
    } else {
      el.style.left = it.x + "px";
      el.style.top = it.y + "px";
      el.style.width = COL_W + "px";
    }
    el.dataset.g = it.key;
    el.innerHTML = `<span class="caret"></span><span class="t">${esc(it.label)}</span>` +
      (it.orphanN ? `<span class="w">${it.orphanN}</span>` : "") +
      `<span class="b">${it.count}</span>`;
  }
  it.el = el;
  rendered.set(it.uid, el);
  nodesEl.appendChild(el);
}

function syncDOM() {
  const vw = stageEl.clientWidth, vh = stageEl.clientHeight;
  const vy1 = -S.ty / S.scale - 60, vy2 = vy1 + (vh + 120) / S.scale;
  const wx1 = -S.tx / S.scale - 60, wx2 = wx1 + (vw + 120) / S.scale;
  const keep = new Set();
  for (let c = 0; c < S.active.length; c++) {
    const arr = S.colItems[c];
    if (!arr || !arr.length) continue;
    const x = colX(c);
    if (x > wx2 || x + COL_W < wx1) continue;   // 整列在视口外
    /* 列内按 y 有序，二分找可见区间 */
    let lo = 0, hi = arr.length;
    while (lo < hi) { const mid = (lo + hi) >> 1;
      if (arr[mid].y + arr[mid].h < vy1) lo = mid + 1; else hi = mid; }
    let start = lo; hi = arr.length;
    while (start < hi) { const mid = (start + hi) >> 1;
      if (arr[mid].y <= vy2) start = mid + 1; else hi = mid; }
    for (let k = lo; k < start; k++) {
      const it = arr[k];
      keep.add(it.uid);
      if (!it.el || !it.el.isConnected) makeEl(it);
    }
  }
  for (const [uid, el] of rendered) {
    if (!keep.has(uid)) {
      const it = S.byUid.get(uid);
      if (it) it.el = null;
      el.remove(); rendered.delete(uid);
    }
  }
}

/* ---------------- 边（聚合 + 视口裁剪） ---------------- */
function buildAgg() {
  /* 折叠状态下同一对条目之间的多条边合并成一条。
     执行边（用例→代码）默认隐藏——大库上聚合后仍是蜘蛛网；只在选中节点时点亮相关的。 */
  const selOn = S.sel !== null;
  const {near, touchUid} = selSets();
  const agg = new Map();
  for (const e of E) {
    const A = S.nodeItem.get(e.a), B = S.nodeItem.get(e.b);
    if (!A || !B || A === B) continue;
    if (e.t === "exercises" && !S.showExec &&
        !(selOn && touchUid.has(A.uid) && touchUid.has(B.uid))) continue;
    const k = A.uid + "\u0000" + B.uid + "\u0000" + e.t;
    let g = agg.get(k);
    if (!g) { g = {A, B, t:e.t, n:0, c:e.c}; agg.set(k, g); }
    g.n++;
    if (e.c === "certain") g.c = "certain";
    else if (e.c === "likely" && g.c === "possible") g.c = "likely";
  }
  S.agg = [...agg.values()];
  S.selNear = near; S.selTouch = touchUid;
}

function drawEdges() {
  const vw = stageEl.clientWidth, vh = stageEl.clientHeight;
  const vy1 = -S.ty / S.scale - 80, vy2 = vy1 + (vh + 160) / S.scale;
  const wx1 = -S.tx / S.scale - 40, wx2 = wx1 + (vw + 80) / S.scale;
  const paths = [];
  for (const g of S.agg) {
    const A = g.A, B = g.B;
    const x1 = rightEdge(A), x2 = leftEdge(B);
    if (x2 < wx1 || x1 > wx2) continue;
    const y1 = A.y + A.h / 2, y2 = B.y + B.h / 2;
    if (Math.max(y1, y2) < vy1 || Math.min(y1, y2) > vy2) continue;
    const w = g.c === "certain" ? 1.7 : g.c === "likely" ? 1.15 : 0.8;
    const dash = g.c === "possible" ? ` stroke-dasharray="5 4"` : "";
    let d;
    if (x2 - x1 < 24) {
      const bulge = Math.max(70, Math.abs(y2 - y1) * 0.5);
      d = `M${x1},${y1} C${x1 + bulge},${y1} ${x2 + bulge},${y2} ${x2},${y2}`;
    } else {
      const dx = (x2 - x1) * 0.5;
      d = `M${x1},${y1} C${x1 + dx},${y1} ${x2 - dx},${y2} ${x2},${y2}`;
    }
    paths.push(`<path d="${d}" class="e ${g.t}" stroke-width="${Math.min(4, w + Math.log2(g.n) * 0.5)}"${dash} data-ab="${A.uid}|${B.uid}"/>`);
  }
  svg.innerHTML = paths.join("");
}

/* 连线锚点：子行缩进 14px */
function leftEdge(it){ return it.type === "node" && it.child ? it.x + 14 : it.x; }
function rightEdge(it){ return leftEdge(it) + (it.type === "node" && it.child ? COL_W - 14 : COL_W); }

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* ---------------- 调度 ---------------- */
let raf = 0, afterPaint = [], cullRaf = 0;
/* 视图操作（居中/适配）必须在 paint 之后跑，否则拿到的是旧布局 */
function schedule(fn) {
  if (fn) afterPaint.push(fn);
  if (raf) return;
  raf = requestAnimationFrame(() => {
    raf = 0;
    paint();
    const q = afterPaint; afterPaint = [];
    q.forEach(f => { try { f(); } catch (e) { console.error(e); } });
  });
}
/* 平移/缩放不重排，只按帧增删可见元素与连线 */
function cull() {
  if (cullRaf) return;
  cullRaf = requestAnimationFrame(() => { cullRaf = 0; syncDOM(); drawEdges(); highlight(); });
}

function paint() {
  layout();
  world.style.width = S.W + "px";
  world.style.height = S.H + "px";
  svg.setAttribute("width", S.W);
  svg.setAttribute("height", S.H);
  svg.setAttribute("viewBox", `0 0 ${S.W} ${S.H}`);

  /* 列头 */
  const headFrag = document.createDocumentFragment();
  const headBox = $("colheads") || (() => {
    const d = document.createElement("div"); d.id = "colheads";
    d.style.cssText = "position:absolute;left:0;top:0";
    world.appendChild(d); return d;
  })();
  headBox.replaceChildren();
  S.active.forEach((slot, c) => {
    const total = N.reduce((a, n) => a + (n.slot === slot ? 1 : 0), 0);
    const shown = S.colShown[c];
    const d = document.createElement("div");
    d.className = "colhead"; d.dataset.slot = slot;
    d.style.left = colX(c) + "px"; d.style.top = "10px"; d.style.width = COL_W + "px";
    d.style.setProperty("--cc", `var(--lc-${slot})`);
    d.innerHTML = `<b>${SLOT_CN[slot]}</b><span>${shown === total ? total : shown + " / " + total}</span>`;
    headFrag.appendChild(d);
  });
  headBox.appendChild(headFrag);

  /* 全量重建可见元素（布局变了，位置都不同） */
  for (const [, el] of rendered) el.remove();
  rendered.clear();
  S.items.forEach(it => { it.el = null; });
  buildAgg();
  syncDOM();
  drawEdges();
  apply();
  $("stat").innerHTML = `<i>${DATA.meta.nodes}</i> 节点 · <i>${DATA.meta.edges}</i> 边 · ` +
    `<em>${orphanCount}</em> 孤儿 · 视口内 ${rendered.size}`;
  highlight();
  $("empty").style.display = S.items.length ? "none" : "flex";
}

/* ---------------- 变换 ---------------- */
function apply() {
  world.style.transform = `translate(${S.tx}px,${S.ty}px) scale(${S.scale})`;
  $("zlvl").textContent = Math.round(S.scale * 100) + "%";
}
function fit() {
  const vw = stageEl.clientWidth, vh = stageEl.clientHeight;
  const s = Math.min((vw - 56) / S.W, (vh - 40) / S.H, 1.1);
  S.scale = Math.max(0.02, s);
  S.tx = (vw - S.W * S.scale) / 2;
  S.ty = Math.max(8, (vh - S.H * S.scale) / 2);
  apply(); cull();
}
function zoomAt(px, py, k) {
  const ns = Math.min(2.6, Math.max(0.03, S.scale * k));
  const r = ns / S.scale;
  S.tx = px - (px - S.tx) * r;
  S.ty = py - (py - S.ty) * r;
  S.scale = ns;
  apply(); cull();
}
function centerOn(it) {
  const vw = stageEl.clientWidth, vh = stageEl.clientHeight;
  if (S.scale < 0.5) S.scale = 0.62;
  S.tx = vw / 2 - (it.x + COL_W / 2) * S.scale;
  S.ty = vh / 2 - (it.y + it.h / 2) * S.scale;
  apply(); cull();
}

/* ---------------- 高亮 ---------------- */
function selSets() {
  const sel = S.sel;
  const near = new Set();
  if (sel !== null) {
    near.add(sel);
    inA[sel].forEach(e => near.add(E[e].a));
    outA[sel].forEach(e => near.add(E[e].b));
  }
  const touchUid = new Set();
  for (const it of S.items) {
    if (it.type === "node") { if (near.has(it.node.i)) touchUid.add(it.uid); }
    else if (it.members.some(i => near.has(i))) touchUid.add(it.uid);
  }
  return {near, touchUid};
}

function highlight() {
  const sel = S.sel;
  let near = S.selNear, execTouch = S.selTouch;
  if (!near || !execTouch) ({near, touchUid: execTouch} = selSets());
  const q = S.q.trim().toLowerCase();

  for (const it of S.items) {
    if (!it.el) continue;   // 视口外的不管
    it.el.classList.remove("dim", "sel", "hit", "path");
    if (it.type === "node") {
      const i = it.node.i;
      if (sel !== null) {
        if (i === sel) it.el.classList.add("sel");
        else if (near.has(i)) it.el.classList.add("path");
        else it.el.classList.add("dim");
      }
      if (q && matchQ(it.node)) it.el.classList.add("hit");
    } else {
      if (sel !== null) {
        if (execTouch.has(it.uid)) it.el.classList.add("path");
        else it.el.classList.add("dim");
      }
      if (q && it.members.some(i => matchQ(N[i]))) it.el.classList.add("hit");
    }
  }
  svg.querySelectorAll("path").forEach(p => {
    if (sel === null) { p.classList.remove("dim"); return; }
    const k = p.dataset.ab.indexOf("|");
    const a = p.dataset.ab.slice(0, k), b = p.dataset.ab.slice(k + 1);
    p.classList.toggle("dim", !(execTouch.has(a) && execTouch.has(b)));
  });
}

/* ---------------- 详情面板 ---------------- */
const panel = $("panel");
function showNode(i) {
  S.sel = i;
  const n = N[i];
  document.body.classList.add("panel-open");
  panel.classList.add("on");

  const tags = [`<span class="tag ${n.slot}">${SLOT_CN[n.slot]}</span>`,
    `<span class="tag c-${n.conf}" title="搜索语法：conf:${n.conf}">${CONF_CN[n.conf] || n.conf}</span>`];
  if (n.status !== "confirmed") tags.push(
    `<span class="tag st-${n.status}" title="搜索语法：status:${n.status}">${ST_CN[n.status] || n.status}</span>`);
  if (n.deg === 0) tags.push(`<span class="tag st-draft">孤立</span>`);
  $("ptags").innerHTML = tags.join("");
  $("ptitle").textContent = n.title;

  const kv = [];
  if (n.file) kv.push(["文件", n.file + (n.line ? ":" + n.line : "")]);
  if (n.kind) kv.push(["类型", n.kind]);
  if (n.nLoc > 1) kv.push(["出现位置", n.nLoc + " 处"]);
  kv.push(["来源", n.src]);
  if (n.ref) kv.push(["证据", n.ref]);
  kv.push(["节点 ID", n.id]);

  const up = inA[i].map(e => ({e:E[e], o:E[e].a}));
  const down = outA[i].map(e => ({e:E[e], o:E[e].b}));

  const relHtml = (list, emptyTxt) => list.length ? `<div class="rel">${list.slice(0, 60).map(x => {
    const t = N[x.o];
    return `<a data-go="${x.o}"><span class="k">${EDGE_CN[x.e.t] || x.e.t}</span>` +
      `<span class="x">${esc(t.title)}</span><span class="n">${x.e.c === "certain" ? "" : (CONF_CN[x.e.c] || x.e.c)}</span></a>`;
  }).join("")}${list.length > 60 ? `<div class="empty">还有 ${list.length - 60} 条…</div>` : ""}</div>`
   : `<div class="empty">${emptyTxt}</div>`;

  let html = "";
  if (n.body) html += `<div class="sect"><h3>说明</h3><pre class="body">${esc(n.body)}</pre></div>`;
  html += `<div class="sect"><h3>属性</h3><dl class="kv">` +
    kv.map(([k,v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("") + `</dl></div>`;
  html += `<div class="sect"><h3>上游 · 谁指向它 (${up.length})</h3>${relHtml(up, n.slot === "intent" || n.slot === "concept" ? "最上层，没有上游" : "没有节点指向它")}</div>`;
  html += `<div class="sect"><h3>下游 · 它指向谁 (${down.length})</h3>${relHtml(down, n.slot === "implementation" ? "代码符号是最底层，没有下游" : "它没有指向任何节点")}</div>`;
  html += `<div class="sect"><h3>操作</h3><div id="pacts">
      <button class="btn" id="actCopy">复制深链</button>
      <button class="btn" id="actCenter">居中</button>
      <button class="btn" id="actOnly">只看这一片</button>
    </div></div>`;
  $("pbody").innerHTML = html;
  $("pbody").scrollTop = 0;

  $("pbody").querySelectorAll("[data-go]").forEach(a => {
    a.onclick = () => { goTo(+a.dataset.go); };
  });
  $("actCopy").onclick = () => {
    const url = location.origin + location.pathname + "#" + encodeURIComponent(n.id);
    navigator.clipboard?.writeText(url).then(
      () => { $("actCopy").textContent = "已复制"; setTimeout(() => $("actCopy").textContent = "复制深链", 1400); },
      () => { prompt("复制这个链接：", url); });
  };
  $("actCenter").onclick = () => { const it = S.nodeItem.get(i); if (it) centerOn(it); };
  $("actOnly").onclick = () => {
    const keep = new Set([i, ...nearOf(i)]);
    S.q = ""; $("q").value = "";
    S.slots = new Set([...keep].map(x => N[x].slot));
    S.orphansOnly = false; $("orphanBtn").classList.remove("on");
    keep.forEach(x => (leafPath.get(x) || []).forEach(k => S.expanded.add(k)));
    renderChips();
    schedule(() => { const it = S.nodeItem.get(i); if (it) centerOn(it); });
  };

  highlight();
  history.replaceState(null, "", "#" + encodeURIComponent(n.id));
}
function nearOf(i) {
  const s = new Set();
  inA[i].forEach(e => s.add(E[e].a));
  outA[i].forEach(e => s.add(E[e].b));
  s.delete(i);
  return s;
}
function goTo(i) {
  const n = N[i];
  /* 目标在折叠组里 → 先展开整条组链，否则点过去什么也看不到 */
  (leafPath.get(i) || []).forEach(k => S.expanded.add(k));
  if (!S.slots.has(n.slot)) { S.slots.add(n.slot); renderChips(); }
  showNode(i);
  schedule(() => { const it = S.nodeItem.get(i); if (it) centerOn(it); });
}
function closePanel() {
  S.sel = null;
  panel.classList.remove("on");
  document.body.classList.remove("panel-open");
  history.replaceState(null, "", location.pathname);
  highlight();
}

/* ---------------- 事件 ---------------- */
nodesEl.addEventListener("click", ev => {
  const g = ev.target.closest(".g");
  if (g) {
    const k = g.dataset.g;
    if (S.expanded.has(k)) S.expanded.delete(k); else S.expanded.add(k);
    schedule();
    return;
  }
  const el = ev.target.closest(".n");
  if (el) showNode(+el.dataset.i);
});

/* 平移 */
let dragging = false, sx = 0, sy = 0, moved = 0;
stageEl.addEventListener("mousedown", ev => {
  if (ev.target.closest(".n,.g")) return;
  dragging = true; moved = 0; sx = ev.clientX; sy = ev.clientY;
  stageEl.classList.add("drag");
});
window.addEventListener("mousemove", ev => {
  if (!dragging) return;
  const dx = ev.clientX - sx, dy = ev.clientY - sy;
  moved += Math.abs(dx) + Math.abs(dy);
  S.tx += dx; S.ty += dy; sx = ev.clientX; sy = ev.clientY;
  apply(); cull();
});
window.addEventListener("mouseup", () => {
  if (dragging && moved < 4) closePanel();
  dragging = false; stageEl.classList.remove("drag");
});
stageEl.addEventListener("wheel", ev => {
  ev.preventDefault();
  const r = stageEl.getBoundingClientRect();
  zoomAt(ev.clientX - r.left, ev.clientY - r.top, ev.deltaY > 0 ? 0.9 : 1.11);
}, {passive:false});

/* ---------------- 自绘悬浮提示 ---------------- */
const tipEl = document.createElement("div");
tipEl.id = "tip";
document.body.appendChild(tipEl);
let tipTimer = 0, tipOn = null;

function tipHTML(el) {
  if (el.classList.contains("n")) {
    const n = N[+el.dataset.i];
    return `<b>${esc(n.title)}</b>` +
      `${SLOT_CN[n.slot]} · 置信度：${CONF_CN[n.conf] || n.conf} · ${ST_CN[n.status] || n.status}` +
      `<br><span class="m">${esc(n.ref || n.id)}</span>`;
  }
  /* 分组条：标题 + 数量 */
  const label = el.querySelector(".t").textContent;
  const cnt = el.querySelector(".b");
  return `<b>${esc(label)}</b>共 ${cnt ? cnt.textContent : "?"} 个`;
}
function showTip(el) {
  tipEl.innerHTML = tipHTML(el);
  tipEl.classList.add("on");
  tipEl.style.left = "0px"; tipEl.style.top = "0px";   // 先归位才能量出真实尺寸
  const r = el.getBoundingClientRect();
  const tw = tipEl.offsetWidth, th = tipEl.offsetHeight;
  /* 右边界：详情面板开着时别钻到面板底下去 */
  const rightLimit = window.innerWidth -
    (document.body.classList.contains("panel-open") ? 408 : 8);
  let x = Math.min(Math.max(8, r.left + 14), Math.max(8, rightLimit - tw));
  let y = r.top - th - 8;
  if (y < 60) y = r.bottom + 8;   // 顶栏下面放不下就放到元素下方
  tipEl.style.left = x + "px"; tipEl.style.top = y + "px";
  tipOn = el;
}
function hideTip() {
  clearTimeout(tipTimer); tipTimer = 0;
  tipEl.classList.remove("on"); tipOn = null;
}
nodesEl.addEventListener("mouseover", ev => {
  const el = ev.target.closest(".n,.g");
  if (!el || el === tipOn) return;
  clearTimeout(tipTimer);
  tipTimer = setTimeout(() => { if (el.isConnected) showTip(el); }, 350);
});
nodesEl.addEventListener("mouseout", ev => {
  const el = ev.target.closest(".n,.g");
  if (el && !el.contains(ev.relatedTarget)) {   // 真正移出这个元素才收起
    if (el === tipOn) hideTip(); else clearTimeout(tipTimer);
  }
});
/* 一有操作就消失：点击、平移、缩放都不让提示框停留 */
stageEl.addEventListener("mousedown", hideTip, true);
stageEl.addEventListener("wheel", hideTip, true);
window.addEventListener("keydown", hideTip);
window.addEventListener("resize", hideTip);

/* 搜索 */
let qt = 0;
$("q").addEventListener("input", ev => {
  clearTimeout(qt);
  qt = setTimeout(() => {
    S.q = ev.target.value.trim();
    schedule(() => {
      if (S.q && S.items.some(it => it.type === "node" && matchQ(it.node))) fitToMatch();
    });
  }, 110);
});
function fitToMatch() {
  const hs = S.items.filter(it => it.type === "node" && matchQ(it.node));
  if (!hs.length) return;
  let x1 = Infinity, x2 = -Infinity, y1 = Infinity, y2 = -Infinity;
  for (const it of hs) {
    if (it.x < x1) x1 = it.x;
    if (it.x + COL_W > x2) x2 = it.x + COL_W;
    if (it.y < y1) y1 = it.y;
    if (it.y + ROW_H > y2) y2 = it.y + ROW_H;
  }
  const vw = stageEl.clientWidth, vh = stageEl.clientHeight;
  const s = Math.min((vw - 80) / (x2 - x1 + 60), (vh - 60) / (y2 - y1 + 40), 1.0);
  S.scale = Math.max(0.03, s);
  S.tx = vw / 2 - (x1 + x2) / 2 * S.scale;
  S.ty = vh / 2 - (y1 + y2) / 2 * S.scale;
  apply(); cull();
}

/* 槽位 chips */
function renderChips() {
  $("slotchips").innerHTML = SLOT_ORDER.map(s => {
    const c = N.reduce((a, n) => a + (n.slot === s ? 1 : 0), 0);
    return `<div class="chip${S.slots.has(s) ? " on" : ""}" data-s="${s}">` +
      `<span class="dot" style="background:var(--lc-${s})"></span>${SLOT_CN[s]} ${c}</div>`;
  }).join("");
  $("slotchips").querySelectorAll(".chip").forEach(el => {
    el.onclick = () => {
      const s = el.dataset.s;
      if (S.slots.has(s)) { if (S.slots.size > 1) S.slots.delete(s); }
      else S.slots.add(s);
      renderChips(); schedule(fit);
    };
  });
}
$("orphanBtn").onclick = e => {
  S.orphansOnly = !S.orphansOnly;
  e.currentTarget.classList.toggle("on", S.orphansOnly);
  schedule(fit);
};
$("execBtn").onclick = e => {
  S.showExec = !S.showExec;
  e.currentTarget.classList.toggle("on", S.showExec);
  schedule();
};
let allOpen = false;
$("expandBtn").onclick = e => {
  allOpen = !allOpen;
  S.expanded.clear();
  if (allOpen) allGroupKeys.forEach(k => S.expanded.add(k));
  e.currentTarget.classList.toggle("on", allOpen);
  e.currentTarget.textContent = allOpen ? "全部折叠" : "全部展开";
  schedule(fit);
};
$("fitBtn").onclick = fit;
$("zi").onclick = () => { const r = stageEl.getBoundingClientRect(); zoomAt(r.width/2, r.height/2, 1.2); };
$("zo").onclick = () => { const r = stageEl.getBoundingClientRect(); zoomAt(r.width/2, r.height/2, 1/1.2); };
$("pclose").onclick = closePanel;
$("themeBtn").onclick = () => {
  const d = document.documentElement.dataset.theme === "dark";
  document.documentElement.dataset.theme = d ? "light" : "dark";
};
document.addEventListener("keydown", ev => {
  if (ev.key === "/" && document.activeElement !== $("q")) { ev.preventDefault(); $("q").focus(); }
  if (ev.key === "Escape") { if (document.activeElement === $("q")) $("q").blur(); else closePanel(); }
  if (ev.key === "f" && document.activeElement !== $("q")) fit();
});
window.addEventListener("resize", () => { apply(); cull(); });

/* ---------------- 图例 ---------------- */
$("legend").innerHTML = `
  <div class="row"><span class="sw" style="background:#10b981"></span>解释（概念页）</div>
  <div class="row"><span class="sw" style="background:#6366f1"></span>由…组成</div>
  <div class="row"><span class="sw" style="background:#06b6d4"></span>由…验证</div>
  <div class="row"><span class="sw" style="background:#f59e0b"></span>执行到</div>
  <hr>
  <div class="row"><span class="sw" style="background:var(--dim);opacity:.6"></span>细虚线 = 置信度较低</div>
  <div class="row">虚线边框 = 未确认 / 孤立</div>`;

/* ---------------- 启动 ---------------- */
/* 脚本出错时至少让人看见，而不是白屏 */
window.onerror = (msg, _src, line) => {
  const d = document.createElement("div");
  d.style.cssText = "position:fixed;left:12px;top:62px;z-index:99;background:#fef2f2;" +
    "border:1px solid #fca5a5;padding:9px 13px;border-radius:8px;font-size:12px;color:#b91c1c;max-width:62%";
  d.textContent = "页面脚本出错：" + msg + "（第 " + line + " 行）";
  document.body.appendChild(d);
};

document.documentElement.style.setProperty("--lc-intent", "#4f46e5");
document.documentElement.style.setProperty("--lc-mechanism", "#0891b2");
document.documentElement.style.setProperty("--lc-verification", "#d97706");
document.documentElement.style.setProperty("--lc-implementation", "#64748b");
document.documentElement.style.setProperty("--lc-concept", "#059669");
/* 深浅色：跟随系统，?theme=dark|light 可强制（分享深链时锁定主题用） */
const themeQ = new URLSearchParams(location.search).get("theme");
if (themeQ === "dark" || (themeQ !== "light" &&
    window.matchMedia("(prefers-color-scheme: dark)").matches)) {
  document.documentElement.dataset.theme = "dark";
}
renderChips();
schedule(() => {
  fit();
  const h = decodeURIComponent(location.hash.slice(1));
  if (h.startsWith("q=")) {
    /* 深链搜索结果：#q=chrono —— 分享筛选视角给同事时用 */
    const q = h.slice(2);
    $("q").value = q;
    S.q = q;
    schedule(fitToMatch);
    return;
  }
  if (h) {
    const i = N.findIndex(n => n.id === h || n.title === h);
    if (i >= 0) goTo(i);
  }
});
</script>
</body>
</html>
